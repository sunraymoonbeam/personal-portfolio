<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">DOSsier RAG agent architecture</title><desc id="d">Indexing pipeline from PDF to FAISS, and a ReAct agent on GPT-3.5 that uses document lookup, arXiv, web search and summarise tools.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1d1d1f">
<text x="40" y="46" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">DOSsier: question answering over official publications</text>
<text x="40" y="72" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Retrieval-augmented generation inside a ReAct agent (LangChain, GPT-3.5, 2023)</text>
<text x="40" y="112" font-size="12" font-weight="700" fill="#0066cc" text-anchor="start">INDEXING (once per upload)</text>
<rect x="40" y="125" width="150" height="82" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="115.0" y="151" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">PDF upload</text>
<text x="115.0" y="170" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">Streamlit</text>
<line x1="190" y1="166" x2="211" y2="166" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="215" y="125" width="150" height="82" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="290.0" y="151" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Extract text</text>
<text x="290.0" y="170" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">pypdf, per page</text>
<line x1="365" y1="166" x2="386" y2="166" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="390" y="125" width="150" height="82" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="465.0" y="151" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Clean</text>
<text x="465.0" y="170" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">join hyphens,</text>
<text x="465.0" y="189" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">fix line breaks</text>
<line x1="540" y1="166" x2="561" y2="166" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="565" y="125" width="150" height="82" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="640.0" y="151" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Chunk</text>
<text x="640.0" y="170" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">1,000 chars,</text>
<text x="640.0" y="189" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">200 overlap</text>
<line x1="715" y1="166" x2="736" y2="166" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="740" y="125" width="150" height="82" rx="12" fill="#eef5fc" stroke="#0066cc" stroke-width="1.5"/>
<text x="815.0" y="151" font-size="15" font-weight="600" fill="#0066cc" text-anchor="middle">Embed + index</text>
<text x="815.0" y="170" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">OpenAI embeddings</text>
<text x="815.0" y="189" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">FAISS in memory</text>
<text x="40" y="250" font-size="12" font-weight="700" fill="#0066cc" text-anchor="start">ANSWERING (each question)</text>
<rect x="40" y="268" width="150" height="72" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="115.0" y="294" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Question</text>
<text x="115.0" y="313" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">chat + last 3 turns</text>
<rect x="260" y="262" width="250" height="190" rx="12" fill="#eef5fc" stroke="#0066cc" stroke-width="1.5"/>
<text x="385.0" y="288" font-size="15" font-weight="600" fill="#0066cc" text-anchor="middle">ReAct agent</text>
<text x="385.0" y="307" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">GPT-3.5 Turbo, temperature 0</text>
<text x="385.0" y="326" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">Thought → Action → Observation</text>
<text x="385.0" y="345" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">Tool order in the prompt:</text>
<text x="385.0" y="364" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">1. documents  2. arXiv  3. web</text>
<text x="385.0" y="383" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">Summarise only on request</text>
<line x1="190" y1="304" x2="256" y2="304" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="590" y="262" width="180" height="52" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="680.0" y="288" font-size="13.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Lookup tool</text>
<text x="680" y="302" font-size="11.5" font-weight="400" fill="#6e6e73" text-anchor="middle">RetrievalQA over FAISS</text>
<line x1="512" y1="357" x2="586" y2="284" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="590" y="320" width="180" height="44" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="680.0" y="346" font-size="13.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">arXiv search</text>
<text x="680" y="358" font-size="11.5" font-weight="400" fill="#6e6e73" text-anchor="middle">research papers</text>
<line x1="512" y1="357" x2="586" y2="342" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="590" y="370" width="180" height="44" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="680.0" y="396" font-size="13.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Web search</text>
<text x="680" y="408" font-size="11.5" font-weight="400" fill="#6e6e73" text-anchor="middle">SerpAPI + page scrape</text>
<line x1="512" y1="357" x2="586" y2="392" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="590" y="420" width="180" height="44" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="680.0" y="446" font-size="13.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Summarise</text>
<text x="680" y="458" font-size="11.5" font-weight="400" fill="#6e6e73" text-anchor="middle">map-reduce over chunks</text>
<line x1="512" y1="357" x2="586" y2="442" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M815 207 L815 236 L680 236 L680 258" fill="none" stroke="#6e6e73" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="822" y="232" font-size="11.5" font-weight="400" fill="#6e6e73" text-anchor="start">vector store</text>
<rect x="810" y="330" width="150" height="92" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="885.0" y="356" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Answer</text>
<text x="885.0" y="375" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">with document and</text>
<text x="885.0" y="394" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">web sources shown,</text>
<text x="885.0" y="413" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="middle">token count</text>
<line x1="772" y1="376" x2="806" y2="376" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="40" y="500" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">inDOStry Navigator reuses this agent with an economist prompt for its PDF chat tab.</text>
</g></svg>