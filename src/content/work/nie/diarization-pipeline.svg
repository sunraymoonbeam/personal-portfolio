<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">Speaker diarization pipeline for classroom recordings</title>
  <desc id="d">Audio goes through optional speech enhancement, voice activity detection, multi-scale speaker embeddings and spectral clustering to produce a who-spoke-when file. A person corrects it in an annotation tool. Talk time and turn counts per student come out at the end. An ASR branch adds words to each speaker turn.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86868b"/>
    </marker>
    <style>
      .b{fill:#ffffff;stroke:#d2d2d7;stroke-width:1.5}
      .k{fill:#f0f6fd;stroke:#0066cc;stroke-width:1.5}
      .x{fill:#ffffff;stroke:#c7c7cc;stroke-width:1.5;stroke-dasharray:5 4}
      .h{font:600 14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;fill:#1d1d1f}
      .s{font:400 12px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;fill:#6e6e73}
      .c{font:600 11px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;fill:#0066cc;letter-spacing:.04em}
      .l{stroke:#86868b;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- row 1 -->
  <text class="c" x="24" y="34">1  CLEAN UP</text>
  <rect class="b" x="24" y="46" width="170" height="78" rx="14"/>
  <text class="h" x="40" y="76">Classroom audio</text>
  <text class="s" x="40" y="96">45-minute group sessions</text>
  <text class="s" x="40" y="112">16 kHz WAV</text>

  <rect class="x" x="234" y="46" width="190" height="78" rx="14"/>
  <text class="h" x="250" y="76">Speech enhancement</text>
  <text class="s" x="250" y="96">delay-and-sum beamforming,</text>
  <text class="s" x="250" y="112">denoising (explored)</text>

  <text class="c" x="464" y="34">2  WHO SPOKE WHEN</text>
  <rect class="k" x="464" y="46" width="200" height="78" rx="14"/>
  <text class="h" x="480" y="76">Voice activity detection</text>
  <text class="s" x="480" y="96">MarbleNet, 10 ms frames,</text>
  <text class="s" x="480" y="112">tuned onset / offset</text>

  <rect class="k" x="704" y="46" width="232" height="78" rx="14"/>
  <text class="h" x="720" y="76">Speaker embeddings</text>
  <text class="s" x="720" y="96">TitaNet, 6 window scales</text>
  <text class="s" x="720" y="112">(0.5 s to 3.0 s)</text>

  <path class="l" d="M194,85 H230" marker-end="url(#a)"/>
  <path class="l" d="M424,85 H460" marker-end="url(#a)"/>
  <path class="l" d="M664,85 H700" marker-end="url(#a)"/>

  <!-- row 2 -->
  <rect class="k" x="704" y="186" width="232" height="78" rx="14"/>
  <text class="h" x="720" y="216">Spectral clustering</text>
  <text class="s" x="720" y="236">eigengap picks the number</text>
  <text class="s" x="720" y="252">of speakers (up to 8)</text>

  <rect class="b" x="464" y="186" width="200" height="78" rx="14"/>
  <text class="h" x="480" y="216">RTTM file</text>
  <text class="s" x="480" y="236">start, duration, speaker</text>
  <text class="s" x="480" y="252">for every turn</text>

  <text class="c" x="234" y="174">3  CHECK BY HAND</text>
  <rect class="b" x="234" y="186" width="190" height="78" rx="14"/>
  <text class="h" x="250" y="216">Human correction</text>
  <text class="s" x="250" y="236">Gecko annotation tool:</text>
  <text class="s" x="250" y="252">fix turns, tag noise</text>

  <text class="c" x="24" y="174">4  MEASURE</text>
  <rect class="k" x="24" y="186" width="170" height="78" rx="14"/>
  <text class="h" x="40" y="216">Participation</text>
  <text class="s" x="40" y="236">talk time, turns,</text>
  <text class="s" x="40" y="252">share per student</text>

  <path class="l" d="M820,124 V182" marker-end="url(#a)"/>
  <path class="l" d="M704,225 H668" marker-end="url(#a)"/>
  <path class="l" d="M464,225 H428" marker-end="url(#a)"/>
  <path class="l" d="M234,225 H198" marker-end="url(#a)"/>

  <!-- ASR branch -->
  <rect class="b" x="464" y="318" width="200" height="78" rx="14"/>
  <text class="h" x="480" y="348">Speech recognition</text>
  <text class="s" x="480" y="368">Conformer-CTC adds words</text>
  <text class="s" x="480" y="384">to each speaker turn</text>
  <path class="l" d="M564,264 V314" marker-end="url(#a)"/>

  <!-- legend -->
  <rect class="k" x="704" y="330" width="18" height="14" rx="4"/>
  <text class="s" x="730" y="342">core diarization stage</text>
  <rect class="x" x="704" y="356" width="18" height="14" rx="4"/>
  <text class="s" x="730" y="368">explored, not in the final runs</text>
</svg>
