<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One database per firm</title>
  <desc id="d">Each firm has its own API endpoint and its own PostgreSQL database on a managed server. A PL/pgSQL function creates a new company record with three admin users. Migration scripts write into one firm's database at a time.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/></marker></defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="600" fill="#1d1d1f">One database per firm</text>
  <text x="40" y="70" font-size="14" fill="#6e6e73">How the platform kept each client's data apart, and where my scripts and SQL touched it</text>
  <g font-size="14" fill="#1d1d1f">
    <rect x="40" y="110" width="250" height="250" rx="14" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="60" y="140" font-size="15" font-weight="600">Platform application</text>
    <text x="60" y="166">Same code for every firm</text>
    <text x="60" y="190">Case, client, document and</text>
    <text x="60" y="210">accounting modules</text>
    <text x="60" y="236">Word report templates</text>
    <text x="60" y="256">filled from model fields</text>
    <text x="60" y="282">JSON-RPC API, one host</text>
    <text x="60" y="302">name per firm</text>

    <rect x="370" y="110" width="250" height="70" rx="14" fill="#e8f1fb" stroke="#0066cc"/>
    <text x="390" y="140" font-size="15" font-weight="600">Firm A database</text>
    <text x="390" y="162">company, users, cases, ledger</text>
    <rect x="370" y="200" width="250" height="70" rx="14" fill="#e8f1fb" stroke="#0066cc"/>
    <text x="390" y="230" font-size="15" font-weight="600">Firm B database</text>
    <text x="390" y="252">company, users, cases, ledger</text>
    <rect x="370" y="290" width="250" height="70" rx="14" fill="#e8f1fb" stroke="#0066cc"/>
    <text x="390" y="320" font-size="15" font-weight="600">Firm C database</text>
    <text x="390" y="342">and so on, one per client</text>

    <rect x="700" y="110" width="220" height="110" rx="14" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="720" y="140" font-size="15" font-weight="600">PL/pgSQL set-up</text>
    <text x="720" y="166">create_company(code, name)</text>
    <text x="720" y="188">adds the company and its</text>
    <text x="720" y="208">three admin users</text>
    <rect x="700" y="250" width="220" height="110" rx="14" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="720" y="280" font-size="15" font-weight="600">Python migration</text>
    <text x="720" y="306">pandas cleans the source,</text>
    <text x="720" y="326">psycopg2 and the importer</text>
    <text x="720" y="346">load one firm at a time</text>
  </g>
  <g stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="290" y1="145" x2="366" y2="145"/>
    <line x1="290" y1="235" x2="366" y2="235"/>
    <line x1="290" y1="325" x2="366" y2="325"/>
    <line x1="698" y1="165" x2="624" y2="150"/>
    <line x1="698" y1="305" x2="624" y2="240"/>
  </g>
  <text x="40" y="400" font-size="13" fill="#6e6e73">Managed PostgreSQL in the cloud. A new firm meant a new database, a set-up function run, then the data migration.</text>
</svg>
