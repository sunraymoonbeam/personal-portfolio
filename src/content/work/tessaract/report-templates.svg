<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From a firm's Word form to a generated document</title>
  <desc id="d">A firm's own form is mapped to platform fields, rebuilt as a Word template with loops and conditions, tested against sample records, then used to generate billing requests, invoices, receipts and letters.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/></marker></defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="600" fill="#1d1d1f">Rebuilding each firm's documents as templates</text>
  <text x="40" y="70" font-size="14" fill="#6e6e73">Billing requests, invoices, credit notes, receipts, trust vouchers, engagement letters, file covers</text>
  <g font-size="14" fill="#1d1d1f">
    <rect x="40" y="110" width="190" height="150" rx="14" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="58" y="140" font-size="15" font-weight="600">The firm's form</text>
    <text x="58" y="166">Their Word or PDF</text>
    <text x="58" y="186">layout, letterhead</text>
    <text x="58" y="206">and wording</text>
    <rect x="268" y="110" width="190" height="150" rx="14" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="286" y="140" font-size="15" font-weight="600">Field map</text>
    <text x="286" y="166">Each blank on the form</text>
    <text x="286" y="186">→ a model field, e.g.</text>
    <text x="286" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">client_id.full_name</text>
    <rect x="496" y="110" width="200" height="160" rx="14" fill="#e8f1fb" stroke="#0066cc"/>
    <text x="514" y="140" font-size="15" font-weight="600">Word template</text>
    <text x="514" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">{#FOR line in lines#}</text>
    <text x="514" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">{#IF tax &gt; 0#}</text>
    <text x="514" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">… {#END-IF#}</text>
    <text x="514" y="230">loops for bill lines,</text>
    <text x="514" y="250">sums for totals</text>
    <rect x="734" y="110" width="186" height="150" rx="14" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="752" y="140" font-size="15" font-weight="600">Test and ship</text>
    <text x="752" y="166">Generate from a test</text>
    <text x="752" y="186">record, compare with</text>
    <text x="752" y="206">the firm's sample,</text>
    <text x="752" y="226">fix, hand over</text>
  </g>
  <g stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="230" y1="185" x2="264" y2="185"/><line x1="458" y1="185" x2="492" y2="185"/><line x1="696" y1="185" x2="730" y2="185"/>
  </g>
  <rect x="40" y="290" width="880" height="70" rx="14" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="60" y="320" font-size="14" font-weight="600" fill="#1d1d1f">About 180 template files across about 10 law firms, 1 claims client and a shared master set</text>
  <text x="60" y="342" font-size="13" fill="#6e6e73">Counted from my archive. The count includes versions of the same document.</text>
</svg>
