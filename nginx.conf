server {
    listen 80;
    server_name _;

    # One host. Absolute on purpose: https is known here, unlike the relative
    # redirects below that must keep whatever scheme the client used.
    if ($host = www.renhwa.com) { return 301 https://renhwa.com$request_uri; }
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik, nginx cannot see that the request arrived over TLS, so an
    # absolute redirect would downgrade https:// to http://. Relative redirects
    # keep the scheme the client actually used.
    absolute_redirect off;

    # Retired placeholder URLs: keep old bookmarks useful, without TLS downgrade.
    location ~ ^/resume/?$      { return 301 /cv/; }
    # /play became /hobbies; these used to point at /play/..., which 404s.
    location ~ ^/play/bouldering/?$ { return 301 /hobbies/climbing/; }
    location ~ ^/play/wok-hei/?$ { return 301 /hobbies/cooking/; }
    location ~ ^/play/guitar/?$ { return 301 /hobbies/guitar/; }
    location ~ ^/play/(film/?)?$ { return 301 /hobbies/; }
    location ~ ^/play/(climbing|cooking|coffee)/?$ { return 301 /hobbies/$1/; }
    # Work slugs dropped the start year. One hop, not Astro's meta-refresh page.
    location ~ ^/work/(carro|ai-singapore|nie|dos|tessaract)-20\d\d/?$ { return 301 /work/$1/; }
    location ~ ^/projects/homelab/?$    { return 301 /projects/; }
    location ~ ^/projects/onboarding/?$ { return 301 /work/ai-singapore/; }

    # A static site must return a real 404. `try_files ... /index.html` would
    # serve the homepage with status 200 for a missing article, which is wrong
    # for users and poisonous for search engines.
    error_page 404 /404.html;

    # nginx drops server-level add_header in any location that sets its own,
    # so every location below repeats the two security headers.

    # Content-hashed assets never change: cache them hard. ^~ stops the image
    # regex below from winning for /_astro/*.webp and fonts.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location ~* \.(png|jpe?g|webp|avif|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # HTML must revalidate, or a deploy never reaches anyone.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /404.html { internal; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/javascript;

    # Serve precompressed files when the build produced them.
    gzip_static on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
