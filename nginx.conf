server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik, nginx cannot see that the request arrived over TLS, so an
    # absolute redirect would downgrade https:// to http://. Relative redirects
    # keep the scheme the client actually used.
    absolute_redirect off;

    # A static site must return a real 404. `try_files ... /index.html` would
    # serve the homepage with status 200 for a missing article, which is wrong
    # for users and poisonous for search engines.
    error_page 404 /404.html;

    # Content-hashed assets never change: cache them hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpe?g|webp|avif|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML must revalidate, or a deploy never reaches anyone.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /404.html { internal; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # Serve precompressed files when the build produced them.
    gzip_static on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
