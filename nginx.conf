server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted assets Astro emits under /_astro/.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve files, fall back to index.html (single entry site).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
